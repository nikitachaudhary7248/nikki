<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,1 ">
     <link rel="stylesheet" href="style.css"> 
</head>
<body>
     <header>
        <div class="logo">website</div>
         <nav class="navbar">
            
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        
         </nav>
    </header>
    <section class="contact">
        <div class="contact-form">
            <h2>Contact Us</h2>
        
    <form id="contactform">
        <input type ="text" id="name" placeholder="enter your name">
        <input type ="email" id="email" placeholder="enter your name">
        <textarea id ="message"  placeholder="enter message" class="contact-inputs" required>

        </textarea>
        <button type="submit">Submit</button>
    </form>
    </div>
    <div class="submission">
       <h2>
        <a href="submissions.html">
         view-submission</a></h2>
    </div>
    </section>

   <script>
        document.getElementById("contactform").addEventListener("submit", function(e){
            e.preventDefault();
            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let message = document.getElementById("message").value;

            if (!name || !email || !message){
                alert("All fields are required!");
                return;
            }
            let submissions = JSON.parse(localStorage.getItem("contacts")) || [];
            submissions.push({name, email, message});
            localStorage.setItem("contacts", JSON.stringify(submissions));
            alert("Form submitted successfully!");
        });
    </script>
    
</body>
</html>
